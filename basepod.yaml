name: omnius-stream
type: container
server: bp.common.al
port: 8080
build:
  dockerfile: Dockerfile
  context: .
domains:
  - omnius.stream
volumes:
  - omnius-stream-data:/app/data
# Non-secret defaults only. Configure POLAR_WEBHOOK_SECRET, ADMIN_SECRET, and
# POLAR_ACCESS_TOKEN in the deployment's secure app environment, never here.
env:
  POLAR_PERSONAL_PRODUCT_ID: "f8c77793-a640-4ddf-95b3-08c7cce637a3"
  POLAR_BUSINESS_PRODUCT_ID: "e5188e7b-a099-42b6-a3e5-691dc3fe6084"
  POLAR_ENTERPRISE_PRODUCT_ID: "f6e95748-3fd8-4d3c-9a07-280e4f65a8a3"
  DATA_DIR: "/app"
